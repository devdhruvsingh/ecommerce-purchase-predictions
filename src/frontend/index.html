```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>E-Commerce Purchase Prediction</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>E-Commerce Purchase Prediction</h1>

        <p class="description">
            Enter the visitor information below to predict
            whether the customer is likely to make a purchase.
        </p>


        <form id="prediction-form">


            <!-- Administrative -->

            <div class="form-group">
                <label for="Administrative">
                    Administrative Pages
                </label>

                <input
                    type="number"
                    id="Administrative"
                    name="Administrative"
                    min="0"
                    step="1"
                    required
                >
            </div>


            <div class="form-group">
                <label for="Administrative_Duration">
                    Administrative Duration
                </label>

                <input
                    type="number"
                    id="Administrative_Duration"
                    name="Administrative_Duration"
                    min="0"
                    step="any"
                    required
                >
            </div>


            <!-- Informational -->

            <div class="form-group">
                <label for="Informational">
                    Informational Pages
                </label>

                <input
                    type="number"
                    id="Informational"
                    name="Informational"
                    min="0"
                    step="1"
                    required
                >
            </div>


            <div class="form-group">
                <label for="Informational_Duration">
                    Informational Duration
                </label>

                <input
                    type="number"
                    id="Informational_Duration"
                    name="Informational_Duration"
                    min="0"
                    step="any"
                    required
                >
            </div>


            <!-- Product Related -->

            <div class="form-group">
                <label for="ProductRelated">
                    Product Related Pages
                </label>

                <input
                    type="number"
                    id="ProductRelated"
                    name="ProductRelated"
                    min="0"
                    step="1"
                    required
                >
            </div>


            <div class="form-group">
                <label for="ProductRelated_Duration">
                    Product Related Duration
                </label>

                <input
                    type="number"
                    id="ProductRelated_Duration"
                    name="ProductRelated_Duration"
                    min="0"
                    step="any"
                    required
                >
            </div>


            <!-- Rates -->

            <div class="form-group">
                <label for="BounceRates">
                    Bounce Rate
                </label>

                <input
                    type="number"
                    id="BounceRates"
                    name="BounceRates"
                    min="0"
                    max="1"
                    step="any"
                    required
                >
            </div>


            <div class="form-group">
                <label for="ExitRates">
                    Exit Rate
                </label>

                <input
                    type="number"
                    id="ExitRates"
                    name="ExitRates"
                    min="0"
                    max="1"
                    step="any"
                    required
                >
            </div>


            <div class="form-group">
                <label for="PageValues">
                    Page Values
                </label>

                <input
                    type="number"
                    id="PageValues"
                    name="PageValues"
                    min="0"
                    step="any"
                    required
                >
            </div>


            <div class="form-group">
                <label for="SpecialDay">
                    Special Day
                </label>

                <input
                    type="number"
                    id="SpecialDay"
                    name="SpecialDay"
                    min="0"
                    max="1"
                    step="any"
                    required
                >
            </div>


            <!-- Month -->

            <div class="form-group">

                <label for="Month">
                    Month
                </label>

                <select
                    id="Month"
                    name="Month"
                    required
                >

                    <option value="">
                        Select Month
                    </option>

                    <option value="Feb">February</option>
                    <option value="Mar">March</option>
                    <option value="May">May</option>
                    <option value="June">June</option>
                    <option value="Jul">July</option>
                    <option value="Aug">August</option>
                    <option value="Sep">September</option>
                    <option value="Oct">October</option>
                    <option value="Nov">November</option>
                    <option value="Dec">December</option>

                </select>

            </div>


            <!-- Technical Information -->

            <div class="form-group">

                <label for="OperatingSystems">
                    Operating System
                </label>

                <input
                    type="number"
                    id="OperatingSystems"
                    name="OperatingSystems"
                    min="0"
                    step="1"
                    required
                >

            </div>


            <div class="form-group">

                <label for="Browser">
                    Browser
                </label>

                <input
                    type="number"
                    id="Browser"
                    name="Browser"
                    min="0"
                    step="1"
                    required
                >

            </div>


            <div class="form-group">

                <label for="Region">
                    Region
                </label>

                <input
                    type="number"
                    id="Region"
                    name="Region"
                    min="0"
                    step="1"
                    required
                >

            </div>


            <div class="form-group">

                <label for="TrafficType">
                    Traffic Type
                </label>

                <input
                    type="number"
                    id="TrafficType"
                    name="TrafficType"
                    min="0"
                    step="1"
                    required
                >

            </div>


            <!-- Visitor -->

            <div class="form-group">

                <label for="VisitorType">
                    Visitor Type
                </label>

                <select
                    id="VisitorType"
                    name="VisitorType"
                    required
                >

                    <option value="">
                        Select Visitor Type
                    </option>

                    <option value="Returning_Visitor">
                        Returning Visitor
                    </option>

                    <option value="New_Visitor">
                        New Visitor
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="Weekend">
                    Weekend
                </label>

                <select
                    id="Weekend"
                    name="Weekend"
                    required
                >

                    <option value="">
                        Select
                    </option>

                    <option value="true">
                        Yes
                    </option>

                    <option value="false">
                        No
                    </option>

                </select>

            </div>


            <!-- Engineered Features -->

            <div class="form-group">

                <label for="TotalPages">
                    Total Pages
                </label>

                <input
                    type="number"
                    id="TotalPages"
                    name="TotalPages"
                    min="0"
                    step="any"
                    required
                >

            </div>


            <div class="form-group">

                <label for="TotalDuration">
                    Total Duration
                </label>

                <input
                    type="number"
                    id="TotalDuration"
                    name="TotalDuration"
                    min="0"
                    step="any"
                    required
                >

            </div>


            <div class="form-group">

                <label for="AvgTimePerPage">
                    Average Time Per Page
                </label>

                <input
                    type="number"
                    id="AvgTimePerPage"
                    name="AvgTimePerPage"
                    min="0"
                    step="any"
                    required
                >

            </div>


            <div class="form-group">

                <label for="ProductEngagementRatio">
                    Product Engagement Ratio
                </label>

                <input
                    type="number"
                    id="ProductEngagementRatio"
                    name="ProductEngagementRatio"
                    min="0"
                    step="any"
                    required
                >

            </div>


            <div class="form-group">

                <label for="ProductTimeRatio">
                    Product Time Ratio
                </label>

                <input
                    type="number"
                    id="ProductTimeRatio"
                    name="ProductTimeRatio"
                    min="0"
                    step="any"
                    required
                >

            </div>


            <!-- Submit -->

            <button type="submit">
                Predict Purchase
            </button>


        </form>


        <!-- Result -->

        <div
            id="result"
            class="hidden"
        >

            <h2 id="prediction"></h2>

            <p id="probability"></p>

        </div>


        <!-- Error -->

        <div
            id="error"
            class="hidden"
        ></div>


    </div>


    <script src="script.js"></script>

</body>

</html>
```
